name: mon_projet
description: Une application Flutter avec Firebase Auth Web
publish_to: "none" # Désactive la publication sur pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core (versions web compatibles)
  firebase_core: ^4.2.1

  # Firebase Auth and UI (web compatible recent versions)
  firebase_auth: ^6.1.2
  firebase_ui_auth: ^3.0.1

  # Firestore et Storage
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4

  # JS interop (needed by firebase_web packages)
  js: ^0.7.2

  # Drift pour la base de données locale
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI et dépendances
  provider: ^6.0.5
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  flutter_slidable: ^3.1.2
  image_picker: ^1.2.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.13.0

flutter:
  uses-material-design: true
